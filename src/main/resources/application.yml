spring:
  application:
    name: cart
  # Perfil por defecto para desarrollo local; en Docker se activa el perfil "docker"
  profiles:
    default: dev
  datasource:
    # Credenciales externalizables por variables de entorno (no quedan fijas en el codigo)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_cart}
    username: ${DB_USERNAME:ecommers}
    password: ${DB_PASSWORD:ecommers_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          # Timeouts para todas las llamadas entre microservicios:
          # falla rapido si un servicio remoto no responde
          default:
            connect-timeout: 2000
            read-timeout: 5000

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# URLs de los microservicios consumidos via Feign
feign:
  client:
    product_url: ${FEIGN_CLIENT_PRODUCT_URL:http://localhost:8081}
    inventory_url: ${FEIGN_CLIENT_INVENTORY_URL:http://localhost:8085}

---
# Perfil docker: se activa en los contenedores (SPRING_PROFILES_ACTIVE=docker).
# Desactiva el SQL por consola; los logs van estructurados en JSON hacia Loki.
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
